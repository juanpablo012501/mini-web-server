<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Web Server</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
    <h1>🌐 Mini Web Server</h1>
    <p>Servidor HTTP secuencial en Java puro</p>
</header>

<main>

    <section class="card">
        <h2>👋 Saludo</h2>
        <div class="input-group">
            <input type="text" id="greetName" placeholder="Tu nombre">
            <button onclick="greet()">Saludar</button>
        </div>
        <div id="greetLoading" class="loading hidden">Cargando...</div>
        <div id="greetResult" class="result hidden"></div>
        <div id="greetError" class="error hidden"></div>
    </section>

    <section class="card">
        <h2>🔢 Cuadrado de un número</h2>
        <div class="input-group">
            <input type="number" id="squareValue" placeholder="Número">
            <button onclick="square()">Calcular</button>
        </div>
        <div id="squareLoading" class="loading hidden">Cargando...</div>
        <div id="squareResult" class="result hidden"></div>
        <div id="squareError" class="error hidden"></div>
    </section>

    <section class="card">
        <h2>🕐 Hora del servidor</h2>
        <button onclick="getTime()">Obtener hora</button>
        <div id="timeLoading" class="loading hidden">Cargando...</div>
        <div id="timeResult" class="result hidden"></div>
        <div id="timeError" class="error hidden"></div>
    </section>

    <section class="card">
        <h2>❤️ Estado del servidor</h2>
        <button onclick="checkHealth()">Verificar</button>
        <div id="healthLoading" class="loading hidden">Cargando...</div>
        <div id="healthResult" class="result hidden"></div>
        <div id="healthError" class="error hidden"></div>
    </section>

</main>

<footer>
    <img src="/images/logo.png" alt="Logo">
    <p>Laboratorio AREP — Servidor HTTP en Java</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
